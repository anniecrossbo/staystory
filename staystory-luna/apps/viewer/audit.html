<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Layout audit</title>
<style>body{margin:0;font:12px system-ui}iframe{position:absolute;left:0;top:0;border:0;visibility:hidden}</style></head>
<body><pre id="out">running…</pre>
<script>
/*
 * /viewer/audit.html?set=hotel|creator|traveler
 * Loads every screen state of one product in a fresh marketplace and reports, per route:
 *   misaligned: controls not centred on their title (see /align.js)
 *   overflow:   horizontal scroll at the design width (hotel is also checked at 1024)
 * Results: window.__audit = { done, rows: [{ route, width, misaligned, overflow }] }; an empty problems list means clean.
 */
const set = new URLSearchParams(location.search).get('set');
const R = (flow, list) => list.map((s) => `${flow}/${s}`);
const SETS = {
  hotel: { widths: [1470, 1024], h: 956, root: 'hotel', routes: [...R('console', ['overview','bookings','bookingDetail','bookingsEmpty','creators','invited','gap','gapConfirm','released','payouts']), ...R('onboarding', ['property','rooms','commission','payouts','review','submitted']), ...R('campaign', ['offer','commission','creators','review','launched'])] },
  creator: { widths: [393, 375], h: 852, root: 'creator', routes: [...R('app', ['insights','empty','trip','earnings','withdrawn','offers','offerDetail','counter','accepted','profile']), ...R('onboard', ['welcome','connect','audience','payout','terms','done']), ...R('create', ['pick','analyzing','error','detected','days','stays','preview','published'])] },
  traveler: { widths: [393, 375], h: 852, root: 'traveler', routes: [...R('social', ['reel','comments','dm']), ...R('trip', ['trip','saved','customize','checkout','payfail','booked','foryou','held']), ...R('auth', ['welcome','phone','otp','otpError','prefs','done']), ...R('discover', ['feed','filtered','loading','empty','creator']), ...R('trips', ['upcoming','past','saved','empty','detail','change','cancel','cancelled','review']), 'me/profile'] },
};
window.__audit = { done: false, rows: [] };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  const cfg = SETS[set]; if (!cfg) { window.__audit.done = true; return; }
  const f = document.createElement('iframe'); document.body.appendChild(f);
  const add = document.createElement('script'); add.src = '/align.js'; document.head.appendChild(add); await new Promise((r) => (add.onload = r));
  let n = 0;
  for (const w of cfg.widths) {
    f.style.width = w + 'px'; f.style.height = cfg.h + 'px';
    for (const route of cfg.routes) {
      f.src = `/${cfg.root}/?ns=au${set[0]}${n++}${Date.now().toString(36)}#/${route}`;
      await new Promise((r) => f.addEventListener('load', r, { once: true })); await wait(450);
      const d = f.contentDocument, win = f.contentWindow;
      const st = d.createElement('style'); st.textContent = '*,*::before,*::after{animation:none!important;transition:none!important}'; d.head.appendChild(st); await wait(120);
      const sc = d.querySelector('.scroll');
      const over = Math.max(d.documentElement.scrollWidth - d.documentElement.clientWidth, sc ? sc.scrollWidth - sc.clientWidth : 0);
      const misaligned = window.__align(d);
      if (misaligned.length || over > 1) window.__audit.rows.push({ route, width: w, misaligned, overflow: over > 1 ? over : 0 });
    }
  }
  window.__audit.done = true; document.getElementById('out').textContent = JSON.stringify(window.__audit.rows, null, 1) || 'clean';
})();
</script></body></html>
